name: Verify FinTechPro
on: [push, pull_request]
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p test_operations.py -v
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ms-usuarios, ms-cuentas, ms-transacciones, ms-prestamos, ms-auditoria]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -f ${{ matrix.module }}/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless
  integration:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: isolated-ci-root
      MYSQL_USER: fintech_user
      MYSQL_PASSWORD: isolated-ci-app
      JWT_SECRET: isolated-ci-jwt-key-at-least-thirty-two-bytes
      INTERNAL_SERVICE_KEY: isolated-ci-internal-service-key
      MYSQL_PORT: '3407'
      FRONTEND_PORT: '4300'
      PORT_8081: '8181'
      PORT_8082: '8182'
      PORT_8083: '8183'
      PORT_8084: '8184'
      PORT_8085: '8185'
      MAIL_UI_PORT: '8125'
      PASSWORD_RESET_FRONTEND_URL: http://localhost:4300/reset-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p fintech-ci up -d --build --wait --wait-timeout 240
      - run: python3 scripts/smoke_test.py --url http://localhost:4300 --mail http://localhost:8125
      - run: python3 scripts/user_smoke_test.py --url http://localhost:4300
      - if: failure()
        run: docker compose -p fintech-ci logs --tail 100
      - if: always()
        run: docker compose -p fintech-ci down
