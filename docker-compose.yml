services:
  mysql-db:
    image: mysql:8.0
    # container_name: fintech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintech-net

  ms-usuarios:
    build: ./ms-usuarios
    # container_name: ms-usuarios
    restart: unless-stopped
    ports:
      - "${PORT_8081:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/fintech_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SMTP_HOST: mailpit
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
      AI_RESPONSES_URL: ${AI_RESPONSES_URL:-https://api.openai.com/v1/responses}
      SERVICES_CUENTAS_URL: http://ms-cuentas:8082
      SERVICES_TRANSACCIONES_URL: http://ms-transacciones:8083
      SERVICES_PRESTAMOS_URL: http://ms-prestamos:8084
      SERVICES_AUDITORIA_URL: http://ms-auditoria:8085
      SMTP_PORT: 1025
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:4200/reset-password}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - fintech-net

  ms-cuentas:
    build: ./ms-cuentas
    # container_name: ms-cuentas
    restart: unless-stopped
    ports:
      - "${PORT_8082:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/fintech_cuentas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      SERVICES_USUARIOS_URL: http://ms-usuarios:8081
      SERVICES_PRESTAMOS_URL: http://ms-prestamos:8084
      SERVICES_AUDITORIA_URL: http://ms-auditoria:8085
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      ms-usuarios:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - fintech-net

  ms-transacciones:
    build: ./ms-transacciones
    # container_name: ms-transacciones
    restart: unless-stopped
    ports:
      - "${PORT_8083:-8083}:8083"
    environment:
      SERVER_PORT: 8083
      SERVICES_AUDITORIA_URL: http://ms-auditoria:8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/fintech_transacciones?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      SERVICES_CUENTAS_URL: http://ms-cuentas:8082
      SERVICES_USUARIOS_URL: http://ms-usuarios:8081
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      ms-usuarios:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - fintech-net

  ms-prestamos:
    build: ./ms-prestamos
    # container_name: ms-prestamos
    restart: unless-stopped
    ports:
      - "${PORT_8084:-8084}:8084"
    environment:
      SERVER_PORT: 8084
      SERVICES_AUDITORIA_URL: http://ms-auditoria:8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/fintech_prestamos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      SERVICES_USUARIOS_URL: http://ms-usuarios:8081
      SERVICES_CUENTAS_URL: http://ms-cuentas:8082
      SERVICES_TRANSACCIONES_URL: http://ms-transacciones:8083
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      ms-usuarios:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - fintech-net

  ms-auditoria:
    build: ./ms-auditoria
    restart: unless-stopped
    ports:
      - "${PORT_8085:-8085}:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/fintech_auditoria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      SERVICES_USUARIOS_URL: http://ms-usuarios:8081
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - fintech-net

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"
    networks:
      - fintech-net

  frontend-angular:
    build: ./frontend-angular
    # container_name: frontend-angular
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      ms-usuarios:
        condition: service_healthy
      ms-cuentas:
        condition: service_healthy
      ms-transacciones:
        condition: service_healthy
      ms-prestamos:
        condition: service_healthy
    networks:
      - fintech-net

volumes:
  mysql_data:

networks:
  fintech-net:
    driver: bridge
