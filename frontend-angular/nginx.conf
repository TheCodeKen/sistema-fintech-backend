server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    location /api/usuarios/asistente { set $destino http://ms-usuarios:8081; proxy_read_timeout 70s; proxy_pass $destino; }
    location /api/usuarios { set $destino http://ms-usuarios:8081; proxy_pass $destino; }
    location /api/auditoria { set $destino http://ms-auditoria:8085; proxy_pass $destino; }
    location /api/cuentas { set $destino http://ms-cuentas:8082; proxy_pass $destino; }
    location /api/transacciones { set $destino http://ms-transacciones:8083; proxy_pass $destino; }
    location /api/alertas { set $destino http://ms-transacciones:8083; proxy_pass $destino; }
    location /api/prestamos { set $destino http://ms-prestamos:8084; proxy_pass $destino; }
    location / { try_files $uri $uri/ /index.html; }
}
