spring.application.name=ms-auditoria
server.port=${SERVER_PORT:8085}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fintech_auditoria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fintech_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-migration-naming=true
app.jwt.secret=${JWT_SECRET}
app.internal.service-key=${INTERNAL_SERVICE_KEY}
services.usuarios.url=${SERVICES_USUARIOS_URL:http://localhost:8081}
server.error.include-message=never
