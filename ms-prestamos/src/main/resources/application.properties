server.port=8084

# DataSource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fintech_prestamos?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.application.name=ms-prestamos
app.jwt.secret=${JWT_SECRET}

# ★ URLs de microservicios consultados via FeignClient ★
feign.client.ms-usuarios.url=${SERVICES_USUARIOS_URL:http://localhost:8081}
feign.client.ms-cuentas.url=${SERVICES_CUENTAS_URL:http://localhost:8082}
feign.client.ms-transacciones.url=${SERVICES_TRANSACCIONES_URL:http://localhost:8083}

# Timeout FeignClient
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

spring.jackson.time-zone=America/Lima
services.usuarios.url=${SERVICES_USUARIOS_URL:http://localhost:8081}
app.internal.service-key=${INTERNAL_SERVICE_KEY}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true

spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=5

services.auditoria.url=${SERVICES_AUDITORIA_URL:http://localhost:8085}
