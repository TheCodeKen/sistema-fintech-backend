# Cambiado a 8081
server.port=8081

# DataSource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fintech_usuarios?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Añadido 1234 como valor por defecto
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# App name
spring.application.name=ms-usuarios

# CORS
cors.allowed-origins=http://localhost:4200

# Mail SMTP
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password recovery
app.mail.from=${APP_MAIL_FROM:no-reply@fintech.pe}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:4200/reset-password}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# JWT (Esto ya estaba correcto)
app.jwt.secret=${JWT_SECRET}
app.internal.service-key=${INTERNAL_SERVICE_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.jackson.time-zone=America/Lima

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=5
app.ia.enabled=${AI_ENABLED:true}
app.ia.provider=${AI_PROVIDER:openai}
app.ia.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.ia.ollama-model=${OLLAMA_MODEL:qwen3:4b-instruct-2507-q4_K_M}
app.ia.api-key=${OPENAI_API_KEY:}
app.ia.model=${AI_MODEL:gpt-5.4-mini}
app.ia.responses-url=${AI_RESPONSES_URL:https://api.openai.com/v1/responses}
app.ia.cuentas-url=${SERVICES_CUENTAS_URL:http://localhost:8082}
app.ia.transacciones-url=${SERVICES_TRANSACCIONES_URL:http://localhost:8083}
app.ia.prestamos-url=${SERVICES_PRESTAMOS_URL:http://localhost:8084}

services.auditoria.url=${SERVICES_AUDITORIA_URL:http://localhost:8085}
